name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            args: "--bundles deb,appimage"
          - name: Windows
            os: windows-latest
            args: "--bundles nsis"
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils file libfuse2t64

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check that the tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(bun --print "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          test "$GITHUB_REF_NAME" = "v$version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'apple-darwin') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Publish installers
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: ntbk v__VERSION__
          releaseBody: |
            Instaladores de escritorio. El cuaderno se guarda en este equipo y no se sincroniza con la cuenta web.
            macOS y Windows pueden avisar porque la aplicación no está firmada.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ntbk-[platform]-[arch][setup][ext]
          uploadUpdaterJson: false

      - name: Build without publishing
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
