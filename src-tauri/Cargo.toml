[package]
name = "ntbk"
version = "0.1.1"
description = "Un espacio local para tus ideas"
authors = ["ntbk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ntbk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
